name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The scripts promise Node 20+: test on the oldest supported version and on the current
      # LTS, in one job so the required "checks" status keeps its name.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Each skill is tested the way it is written (see AGENTS.md), so install only the tools
      # the skills need. The runner lists them; the shell tools are pinned to the latest stable
      # versions as of 2026-10-30 (look up newer ones with `mise latest <tool>`). Python 3 is
      # already on the runner.
      - name: List the tools the skills need
        id: needs
        run: |
          tools="$(node scripts/run-tests.mjs --needs | tr '\n' ' ')"
          echo "Tools needed: ${tools:-none}"
          case " ${tools} " in *" shfmt "*) echo "shell=true" >>"$GITHUB_OUTPUT" ;; esac
      - name: Install ShellCheck and shfmt
        if: steps.needs.outputs.shell == 'true'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          mise_toml: |
            [tools]
            shellcheck = "0.11.0"
            shfmt = "3.14.1"
      - name: Test the skill scripts (Node 20)
        run: npm test
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the skill scripts (Node 24)
        run: npm test
      - name: Check every skill (catalog layout)
        run: npm run check
      # The plugin manifests must parse, name the same plugin and carry the same version.
      - name: Check plugin manifests
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const read = (p) => JSON.parse(readFileSync(p, "utf8"));
          const claude = read(".claude-plugin/plugin.json");
          const codex = read("plugin.json");
          const claudeMarket = read(".claude-plugin/marketplace.json");
          const codexMarket = read(".agents/plugins/marketplace.json");
          const fail = (m) => { console.error(m); process.exit(1); };
          if (claude.name !== codex.name) fail(`plugin names differ: ${claude.name} vs ${codex.name}`);
          if (claude.version !== codex.version) fail(`plugin versions differ: ${claude.version} vs ${codex.version}`);
          for (const [file, market] of [[".claude-plugin/marketplace.json", claudeMarket], [".agents/plugins/marketplace.json", codexMarket]])
            if (!market.plugins?.some((p) => p.name === claude.name)) fail(`${file} does not list ${claude.name}`);
          console.log(`Manifests OK (${claude.name} ${claude.version}).`);
          '
